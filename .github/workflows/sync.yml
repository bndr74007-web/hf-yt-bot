name: Sync to Hugging Face Hub
on:
  push:
    branches: [ master ]
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://bndr74007-web:$HF_TOKEN@huggingface.co/spaces/bndr74007-web/hf-yt-bot master
